name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Lint with Ruff
        run: uv run ruff check simuls_misspecif/ tests/

      - name: Type check with Mypy
        run: uv run mypy simuls_misspecif/ tests/

      - name: Run tests with Pytest
        run: uv run pytest
